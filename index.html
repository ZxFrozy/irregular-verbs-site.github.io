<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irregular Verbs — тренажёр</title>
<style>
:root{color-scheme:light;--bg:#000000;--card:#000000;--ink:#ffffff;--muted:#000000;--line:#ffffff;--accent:#ffffff;--good:#ffffff;--bad:#ffffff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(100%,650px)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand{font-weight:800;font-size:18px}.tag{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 35px #25365b0d}
.progressline{height:7px;background:#fff;border-radius:99px;overflow:hidden;margin:12px 0 24px}.progress{height:100%;width:0;background:var(--accent);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;gap:12px}.prompt{font-size:clamp(26px,5vw,36px);font-weight:800;line-height:1.2;text-align:center;margin:22px 0 8px}.hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
label{display:block;font-weight:650;margin-bottom:8px}input{width:100%;font:inherit;padding:14px 15px;border:1px solid #0040ff;border-radius:12px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #3457d51c}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:white;width:100%;margin-top:12px}.secondary{background:#edf0f7;color:var(--ink)}.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}.feedback{padding:14px;border-radius:12px;margin-top:16px}.feedback.good{background:#eaf7ef;color:var(--good)}.feedback.bad{background:#fff0ef;color:var(--bad)}.answer{color:var(--ink);font-weight:800;margin-top:4px}.stats{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;margin-top:20px}.settings{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.settings button{font-size:13px;padding:8px 11px}.settings .selected{background:#e4e9ff;color:#233eb2}.hidden{display:none!important}.finish{text-align:center}.finish h2{font-size:30px}.small{font-size:13px;color:var(--muted);text-align:center;margin-top:16px}.kbd{font-size:12px;background:#edf0f7;padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">📚 Irregular Verbs</div><div class="tag">Тренажёр на 3 формы</div></div>
  <section class="card" id="quiz">
    <div class="meta"><span id="roundLabel">Раунд 1</span><span id="count">Вопрос 1 из 56</span></div>
    <div class="progressline"><div class="progress" id="progress"></div></div>
    <div class="prompt" id="prompt">быть, находиться</div>
    <div class="hint">Введи 3 формы на английском: Infinitive · Past Simple · Past Participle</div>
    <form id="answerForm">
      <label for="answer">Твой ответ</label>
      <input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="be — was/were — been" required>
      <button class="primary" id="checkBtn" type="submit">Проверить</button>
    </form>
    <div id="feedback" class="feedback hidden" aria-live="polite"></div>
    <div class="row hidden" id="nextRow"><button class="primary" id="nextBtn">Следующий глагол →</button></div>
    <div class="stats"><span>Верно: <b id="score">0</b></span><span>Серия: <b id="streak">0</b> 🔥</span></div>
    <div class="settings">
      <button class="secondary selected" id="shuffleBtn">🔀 Случайный порядок: вкл.</button>
      <button class="secondary" id="retryWrongBtn">Повторить ошибки</button>
      <button class="secondary" id="restartBtn">Начать заново</button>
    </div>
  </section>
  <section class="card finish hidden" id="finish">
    <div style="font-size:44px">🏆</div><h2>Раунд завершён!</h2>
    <p id="finalScore"></p><p id="finalText"></p>
    <button class="primary" id="againBtn">Ещё один круг</button>
    <button class="secondary" id="wrongAgainBtn" style="width:100%;margin-top:10px">Повторить ошибки</button>
  </section>
  <p class="small">Подсказка: можно разделять формы пробелами, запятыми или тире. Прогресс сохраняется в этом браузере.</p>
</main>
<script>
const verbs = [
["быть, находиться","be","was/were","been"],
["становиться, делаться","become","became","become"],
["начинать, приступать","begin","began","begun"],
["ломать, разбивать","break","broke","broken"],
["приносить, привозить","bring","brought","brought"],
["строить, сооружать","build","built","built"],
["покупать, приобретать","buy","bought","bought"],
["ловить, поймать","catch","caught","caught"],
["выбирать, подбирать","choose","chose","chosen"],
["приходить, приезжать","come","came","come"],
["стоить","cost","cost","cost"],
["резать, разрезать","cut","cut","cut"],
["копать, рыть","dig","dug","dug"],
["делать, выполнять","do","did","done"],
["рисовать, чертить","draw","drew","drawn"],
["мечтать, видеть сны","dream","dreamed/dreamt","dreamed/dreamt"],
["пить","drink","drank","drunk"],
["водить машину, ехать за рулём","drive","drove","driven"],
["есть, кушать","eat","ate","eaten"],
["падать, опускаться","fall","fell","fallen"],
["кормить, питать","feed","fed","fed"],
["чувствовать, ощущать","feel","felt","felt"],
["сражаться, драться, бороться","fight","fought","fought"],
["находить, обнаруживать","find","found","found"],
["летать, пролетать","fly","flew","flown"],
["забывать, забыть","forget","forgot","forgotten"],
["прощать, извинять","forgive","forgave","forgiven"],
["получать, приобретать, добираться","get","got","got/gotten"],
["давать, дарить","give","gave","given"],
["идти, ехать, отправляться","go","went","gone"],
["расти, выращивать","grow","grew","grown"],
["иметь, обладать","have","had","had"],
["слышать, слушать","hear","heard","heard"],
["прятать, скрывать","hide","hid","hidden"],
["ударять, попадать","hit","hit","hit"],
["держать, проводить (встречу)","hold","held","held"],
["ранить, причинять боль","hurt","hurt","hurt"],
["хранить, держать, сохранять","keep","kept","kept"],
["знать, узнавать","know","knew","known"],
["вести, руководить","lead","led","led"],
["учиться, узнавать","learn","learned/learnt","learned/learnt"],
["оставлять, покидать, уходить","leave","left","left"],
["давать взаймы, одалживать","lend","lent","lent"],
["позволять, разрешать","let","let","let"],
["лежать, находиться","lie","lay","lain"],
["зажигать, освещать","light","lit/lighted","lit/lighted"],
["терять, проигрывать","lose","lost","lost"],
["делать, создавать, производить","make","made","made"],
["значить, иметь в виду","mean","meant","meant"],
["встречать, знакомиться","meet","met","met"],
["платить, оплачивать","pay","paid","paid"],
["класть, положить, ставить","put","put","put"],
["читать","read","read","read"],
["ехать верхом, кататься","ride","rode","ridden"],
["звонить, звенеть","ring","rang","rung"],
["бежать, управлять","run","ran","run"],
["говорить, сказать","say","said","said"]
];
const $ = id => document.getElementById(id);
let order=[], pos=0, score=0, streak=0, wrong=[], checked=false, shuffle=true;
function norm(s){return s.toLowerCase().trim().replace(/[—–,;]+/g," ").replace(/\s+/g," ")}
function accepted(s){return s.split("/").map(x=>x.trim().toLowerCase())}
function parseAnswer(s){return s.toLowerCase().trim().split(/[\s,;—–-]+/).filter(Boolean)}
function start(list=null){
  order=list ? [...list] : verbs.map((_,i)=>i);
  if(shuffle && !list) order.sort(()=>Math.random()-.5);
  pos=0;score=0;streak=0;wrong=[];checked=false;
  $("quiz").classList.remove("hidden");$("finish").classList.add("hidden");
  updateStats();render();save();
}
function render(){
  if(pos>=order.length){finish();return}
  const v=verbs[order[pos]];
  $("prompt").textContent=v[0];$("count").textContent=`Вопрос ${pos+1} из ${order.length}`;
  $("roundLabel").textContent=`Раунд ${Number(localStorage.getItem("round")||0)+1}`;
  $("progress").style.width=`${pos/order.length*100}%`;
  $("answer").value="";$("answer").disabled=false;$("checkBtn").disabled=false;
  $("feedback").className="feedback hidden";$("nextRow").classList.add("hidden");
  checked=false;$("answer").focus();
}
function check(e){
  e.preventDefault();if(checked)return;
  const v=verbs[order[pos]], p=parseAnswer($("answer").value);
  // Forms may contain slash alternatives; compare each entered form to any accepted variant.
  const ok=p.length===3 && p.every((x,i)=>accepted(v[i+1]).some(a=>a===x));
  checked=true;$("answer").disabled=true;$("checkBtn").disabled=true;
  $("feedback").className="feedback "+(ok?"good":"bad");
  $("feedback").innerHTML=(ok?"Верно! 🎉":"Почти! Правильный ответ:")+
    `<div class="answer">${v.slice(1).join(" — ")}</div>`;
  if(ok){score++;streak++}else{streak=0;wrong.push(order[pos])}
  updateStats();$("progress").style.width=`${(pos+1)/order.length*100}%`;
  $("nextBtn").textContent=pos===order.length-1?"Завершить раунд":"Следующий глагол →";
  $("nextRow").classList.remove("hidden");save();
}
function next(){pos++;if(pos>=order.length)finish();else render()}
function updateStats(){$("score").textContent=score;$("streak").textContent=streak}
function finish(){
  $("quiz").classList.add("hidden");$("finish").classList.remove("hidden");
  $("finalScore").textContent=`Результат: ${score} из ${order.length} (${Math.round(score/order.length*100)}%).`;
  $("finalText").textContent=wrong.length?`Ошибок: ${wrong.length}. Можно пройти их отдельно или начать новый круг.`:"Без ошибок — идеально!";
  $("progress").style.width="100%";
  localStorage.setItem("round",String(Number(localStorage.getItem("round")||0)+1));
  save();
}
function save(){
  try{localStorage.setItem("irregularQuizState",JSON.stringify({order,pos,score,streak,wrong,shuffle}))}catch(e){}
}
$("answerForm").addEventListener("submit",check);
$("nextBtn").addEventListener("click",next);
$("restartBtn").addEventListener("click",()=>start());
$("againBtn").addEventListener("click",()=>start());
$("retryWrongBtn").addEventListener("click",()=>wrong.length?start(wrong):alert("Пока нет ошибок — отлично!"));
$("wrongAgainBtn").addEventListener("click",()=>wrong.length?start(wrong):start());
$("shuffleBtn").addEventListener("click",()=>{shuffle=!shuffle;$("shuffleBtn").classList.toggle("selected",shuffle);$("shuffleBtn").textContent=`🔀 Случайный порядок: ${shuffle?"вкл.":"выкл."}`;save()});
start();
</script>
</body>
</html>
